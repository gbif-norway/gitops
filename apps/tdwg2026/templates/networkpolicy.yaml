# The namespace has a default-deny policy; let the ingress controller reach the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tdwg2026
spec:
  podSelector:
    matchLabels:
      app: tdwg2026
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-ingress
      ports:
        - port: 8787
          protocol: TCP
