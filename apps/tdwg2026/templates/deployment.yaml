apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdwg2026
  labels:
    app: tdwg2026
spec:
  replicas: 1
  # The quota can't hold two pods at once, so replace the pod instead of rolling.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdwg2026
  template:
    metadata:
      labels:
        app: tdwg2026
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: tdwg2026
          image: gbifnorway/tdwg2026:48fa94f-local
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          # The namespace quota has ~350Mi of memory limits left; the server peaks around 300Mi.
          # The LimitRange caps limits at 2x requests.
          resources:
            requests:
              cpu: 200m
              memory: 170Mi
            limits:
              cpu: "1"
              memory: 340Mi
