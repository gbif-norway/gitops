apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdwg2026
  labels:
    app: tdwg2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdwg2026
  template:
    metadata:
      labels:
        app: tdwg2026
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: tdwg2026
          image: gbifnorway/tdwg2026:9734908-local
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
